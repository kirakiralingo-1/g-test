<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#0a0a0f;
--surface:#14141f;
--border:#1e1e2e;
--text:#e2e2e8;
--text-dim:#8888a0;
--accent:#6c5ce7;
--accent2:#a855f7;
--accent3:#ec4899;
--glow:rgba(108,92,231,.3);
}
html{scroll-behavior:smooth}
body{
font-family:'Segoe UI','Hiragino Sans','Noto Sans JP',sans-serif;
background:var(--bg);
color:var(--text);
min-height:100vh;
overflow-x:hidden;
}
body::before{
content:'';
position:fixed;
inset:0;
background:
radial-gradient(ellipse 80% 50% at 20% -20%,rgba(108,92,231,.12),transparent),
radial-gradient(ellipse 60% 40% at 80% 100%,rgba(236,72,153,.08),transparent);
pointer-events:none;
z-index:0;
}
.container{
max-width:1400px;
margin:0 auto;
padding:0 24px;
position:relative;
z-index:1;
}
header{
padding:48px 0 32px;
text-align:center;
}
header h1{
font-size:clamp(2.5rem,6vw,4rem);
font-weight:800;
background:linear-gradient(135deg,#6c5ce7,#a855f7,#ec4899);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
background-clip:text;
letter-spacing:-.02em;
margin-bottom:8px;
}
header p{
color:var(--text-dim);
font-size:1.05rem;
}
.controls{
display:flex;
flex-wrap:wrap;
gap:16px;
align-items:center;
justify-content:center;
margin:32px 0;
padding:24px;
background:var(--surface);
border:1px solid var(--border);
border-radius:20px;
position:relative;
z-index:10;
}
.search-wrap{
position:relative;
flex:1;
min-width:240px;
max-width:400px;
}
.search-wrap input{
width:100%;
padding:14px 20px 14px 48px;
background:#1a1a2a;
border:1px solid var(--border);
border-radius:14px;
color:var(--text);
font-size:.95rem;
outline:none;
transition:.3s;
}
.search-wrap input:focus{
border-color:var(--accent);
box-shadow:0 0 0 3px var(--glow);
}
.search-wrap input::placeholder{color:var(--text-dim)}
.search-wrap svg{
position:absolute;
left:16px;
top:50%;
transform:translateY(-50%);
width:20px;
height:20px;
stroke:var(--text-dim);
}
.mode-toggle{
display:flex;
background:#1a1a2a;
border:1px solid var(--border);
border-radius:12px;
overflow:hidden;
}
.mode-toggle button{
padding:12px 20px;
background:none;
border:none;
color:var(--text-dim);
font-size:.85rem;
font-weight:600;
cursor:pointer;
transition:.3s;
white-space:nowrap;
}
.mode-toggle button.active{
background:linear-gradient(135deg,var(--accent),var(--accent2));
color:#fff;
}
.mode-toggle button:not(.active):hover{
background:#22223a;
color:var(--text);
}
.dropdown-wrap{
position:relative;
z-index:200;
}
.dropdown-btn{
display:flex;
align-items:center;
gap:8px;
padding:12px 20px;
background:#1a1a2a;
border:1px solid var(--border);
border-radius:12px;
color:var(--text);
font-size:.88rem;
font-weight:600;
cursor:pointer;
transition:.3s;
min-width:180px;
justify-content:space-between;
}
.dropdown-btn:hover{
border-color:var(--accent);
box-shadow:0 0 0 3px var(--glow);
}
.dropdown-btn .badge{
background:linear-gradient(135deg,var(--accent),var(--accent2));
color:#fff;
font-size:.7rem;
padding:2px 8px;
border-radius:50px;
min-width:20px;
text-align:center;
}
.dropdown-btn .arrow{
width:16px;
height:16px;
transition:.3s;
}
.dropdown-wrap.open .arrow{
transform:rotate(180deg);
}
.dropdown-menu{
position:absolute;
top:calc(100% + 8px);
left:0;
min-width:220px;
background:#1a1a2e;
border:1px solid var(--border);
border-radius:14px;
padding:8px;
box-shadow:0 20px 60px rgba(0,0,0,.5);
z-index:200;
opacity:0;
transform:translateY(-8px) scale(.96);
pointer-events:none;
transition:.25s cubic-bezier(.25,.46,.45,.94);
}
.dropdown-wrap.open .dropdown-menu{
opacity:1;
transform:translateY(0) scale(1);
pointer-events:auto;
}
.dropdown-item{
display:flex;
align-items:center;
gap:10px;
padding:10px 14px;
border-radius:10px;
cursor:pointer;
transition:.2s;
font-size:.88rem;
color:var(--text-dim);
}
.dropdown-item:hover{
background:#22223a;
color:var(--text);
}
.dropdown-item input[type="radio"]{
appearance:none;
width:18px;
height:18px;
border:2px solid var(--border);
border-radius:50%;
cursor:pointer;
transition:.2s;
position:relative;
flex-shrink:0;
}
.dropdown-item input[type="radio"]:checked{
border-color:var(--accent);
background:linear-gradient(135deg,var(--accent),var(--accent2));
}
.dropdown-item input[type="radio"]:checked::after{
content:'';
position:absolute;
inset:4px;
border-radius:50%;
background:#fff;
}
.dropdown-item input[type="radio"]:checked ~ span{
color:var(--text);
}
.grid{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
gap:20px;
padding-bottom:80px;
}
.card{
background:var(--surface);
border:1px solid var(--border);
border-radius:16px;
overflow:hidden;
transition:.3s cubic-bezier(.25,.46,.45,.94);
text-decoration:none;
color:inherit;
display:block;
position:relative;
z-index:1;
}
.card:hover{
transform:translateY(-4px);
border-color:rgba(108,92,231,.4);
box-shadow:0 12px 40px rgba(0,0,0,.4);
z-index:2;
}
.card-img{
width:100%;
height:160px;
object-fit:cover;
display:block;
transition:.3s;
}
.card:hover .card-img{
transform:scale(1.03);
}
.card-img-wrap{
overflow:hidden;
position:relative;
}
.card-img-wrap::after{
content:'';
position:absolute;
inset:0;
background:linear-gradient(to top,rgba(10,10,15,.5),transparent 50%);
pointer-events:none;
}
.card-body{
padding:16px;
}
.card-tags{
display:flex;
flex-wrap:wrap;
gap:6px;
margin-bottom:10px;
}
.card-tag{
padding:3px 10px;
border-radius:50px;
font-size:.68rem;
font-weight:600;
letter-spacing:.03em;
background:rgba(108,92,231,.15);
color:#a78bfa;
border:1px solid rgba(108,92,231,.25);
}
.card-title{
font-size:1rem;
font-weight:700;
line-height:1.4;
margin-bottom:8px;
transition:.3s;
}
.card:hover .card-title{
background:linear-gradient(135deg,#a78bfa,#ec4899);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
background-clip:text;
}
.card-desc{
color:var(--text-dim);
font-size:.82rem;
line-height:1.6;
display:-webkit-box;
-webkit-line-clamp:2;
-webkit-box-orient:vertical;
overflow:hidden;
}
.card-footer{
display:flex;
align-items:center;
justify-content:space-between;
margin-top:12px;
padding-top:12px;
border-top:1px solid var(--border);
}
.card-date{
font-size:.75rem;
color:var(--text-dim);
}
.card-read{
font-size:.78rem;
font-weight:600;
color:var(--accent);
display:flex;
align-items:center;
gap:4px;
transition:.3s;
}
.card:hover .card-read{
gap:8px;
color:var(--accent2);
}
.empty{
grid-column:1/-1;
text-align:center;
padding:80px 20px;
color:var(--text-dim);
font-size:1.1rem;
}
.empty svg{
width:64px;
height:64px;
stroke:var(--text-dim);
margin-bottom:16px;
opacity:.5;
}
@keyframes fadeUp{
from{opacity:0;transform:translateY(20px)}
to{opacity:1;transform:translateY(0)}
}
.card{animation:fadeUp .4s ease both}
.card:nth-child(2){animation-delay:.04s}
.card:nth-child(3){animation-delay:.08s}
.card:nth-child(4){animation-delay:.12s}
.card:nth-child(5){animation-delay:.16s}
.card:nth-child(6){animation-delay:.2s}
@media(max-width:768px){
.controls{flex-direction:column}
.search-wrap{max-width:100%}
.grid{grid-template-columns:1fr}
header{padding:32px 0 24px}
}
</style>
</head>
<body>
<div class="container">
<header>
<h1>My Blog</h1>
<p>アイデアと知識を共有する場所</p>
</header>
<div class="controls">
<div class="search-wrap">
<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
<input type="text" id="search" placeholder="記事を検索...">
</div>
<div class="dropdown-wrap" id="ddWrap">
<button class="dropdown-btn" id="ddBtn">
<span id="ddLabel">カテゴリ</span>
<span class="badge" id="ddBadge" style="display:none"></span>
<svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
</button>
<div class="dropdown-menu" id="ddMenu"></div>
</div>
<div class="mode-toggle">
<button id="modeAnd" class="active">含む</button>
<button id="modeNot">除外</button>
</div>
</div>
<div class="grid" id="grid"></div>
</div>
<script>
<!-- {id:10,url:"",title:"",desc:"35文字まで",date:"2026-09-01",img:"",cats:["",""]},-->
const posts=[
{id:1,url:"game/12-minibattles-main/index.html",title:"12個の対戦ミニゲーム集",desc:"一つのPCで友達と対戦！12個のミニゲームで遊ぼう！",date:"2026-09-01",img:"",cats:["二人以上"]},
{id:2,url:"game/BasketRandom-gh-pages/index.html",title:"ランダム：バスケット",desc:"ランダムに動くキャラをうまく操作してゴールを決めよう！",date:"2026-09-01",img:"",cats:["一人プレイ","二人以上"]},
{id:3,url:"game/StickmanHook-gh-pages/index.html",title:"スティックマン：フック",desc:"棒人間を操り、壁から壁へフックをかけてゴールを目指せ！",date:"2026-09-01",img:"",cats:["一人プレイ","プラットフォーム"]},
{id:4,url:"game/BasketballStars-gh-pages/index.html",title:"バスケットボール・スターズ",desc:"大人気のバスケゲーム！相手からボールを奪い、シュートし、ダンクを決めろ！",date:"2026-09-01",img:"",cats:["一人プレイ","二人以上","人気"]},
{id:5,url:"game/bacon/bacon-may-die-main/index.html",title:"ベーコンも死ぬかも",desc:"大人気「Iron Snot」と同じ制作会社のゲーム！現れる敵をなぎ倒せ！",date:"2026-09-01",img:"",cats:["一人プレイ","プラットフォーム","爽快"]},
{id:6,url:"game/bacon-may-die-main/index.html",title:"ベーコンも死ぬかも　Beta版",desc:"お隣作品のBeta版。プラットフォーム間隔はなく、ひたすらなぎ倒す練習用ゲーム！",date:"2026-09-01",img:"",cats:["一人プレイ","爽快"]},
{id:7,url:"game/Cubes2048IO-gh-pages/index.htm",title:"キューブs 2048 IO",desc:"他のブロックを食ってひたすら大きくなれ！",date:"2026-09-01",img:"",cats:["一人プレイ","人気","IO"]},
{id:8,url:"game/PaperIO2-gh-pages/index.html",title:"ペーパー IO 2",desc:"自分の陣地を、時には相手の陣地も飲み込んでひたすら広げろ！",date:"2026-09-01",img:"",cats:["一人プレイ","人気","IO"]},
{id:9,url:"game/WarriorSurvivalIO-gh-pages/index.html",title:"ウォーリア サバイバル",desc:"ブロスタに似てるゲーム。最後の一人になれ！",date:"2026-09-01",img:"",cats:["一人プレイ","似てる"]}
];
const allCats=[...new Set(posts.flatMap(p=>p.cats))].sort();
const grid=document.getElementById('grid');
const ddWrap=document.getElementById('ddWrap');
const ddBtn=document.getElementById('ddBtn');
const ddMenu=document.getElementById('ddMenu');
const ddLabel=document.getElementById('ddLabel');
const ddBadge=document.getElementById('ddBadge');
const searchEl=document.getElementById('search');
const modeAnd=document.getElementById('modeAnd');
const modeNot=document.getElementById('modeNot');
let selectedCat=null;
let excludeMode=false;
let searchQuery='';
const noneItem=document.createElement('label');
noneItem.className='dropdown-item';
noneItem.innerHTML=`<input type="radio" name="cat" value="" checked><span>すべて</span>`;
ddMenu.appendChild(noneItem);
allCats.forEach(c=>{
const item=document.createElement('label');
item.className='dropdown-item';
item.innerHTML=`<input type="radio" name="cat" value="${c}"><span>${c}</span>`;
ddMenu.appendChild(item);
});
ddMenu.addEventListener('change',e=>{
if(e.target.name==='cat'){
selectedCat=e.target.value||null;
updateDropdown();
render();
}
});
ddBtn.addEventListener('click',e=>{
e.stopPropagation();
ddWrap.classList.toggle('open');
});
document.addEventListener('click',e=>{
if(!ddWrap.contains(e.target))ddWrap.classList.remove('open');
});
function updateDropdown(){
if(selectedCat){
ddBadge.style.display='inline';
ddBadge.textContent='1';
ddLabel.textContent=selectedCat;
}else{
ddBadge.style.display='none';
ddLabel.textContent='カテゴリ';
}
}
modeAnd.onclick=()=>{
excludeMode=false;
modeAnd.classList.add('active');
modeNot.classList.remove('active');
render();
};
modeNot.onclick=()=>{
excludeMode=true;
modeNot.classList.add('active');
modeAnd.classList.remove('active');
render();
};
searchEl.addEventListener('input',e=>{
searchQuery=e.target.value.trim().toLowerCase();
render();
});
function matchesCats(post){
if(!selectedCat)return true;
const has=post.cats.includes(selectedCat);
return excludeMode?!has:has;
}
function matchesSearch(post){
if(!searchQuery)return true;
return post.title.toLowerCase().includes(searchQuery)||post.desc.toLowerCase().includes(searchQuery);
}
function render(){
const filtered=posts.filter(p=>matchesCats(p)&&matchesSearch(p));
if(!filtered.length){
grid.innerHTML=`<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/><path d="M8 11h6"/></svg><p>該当する記事がありません</p></div>`;
return;
}
grid.innerHTML=filtered.map(p=>`
<a class="card" href="${p.url}">
<div class="card-img-wrap"><img class="card-img" src="${p.img}" alt="${p.title}" loading="lazy"></div>
<div class="card-body">
<div class="card-tags">${p.cats.map(c=>`<span class="card-tag">${c}</span>`).join('')}</div>
<h2 class="card-title">${p.title}</h2>
<p class="card-desc">${p.desc}</p>
<div class="card-footer">
<span class="card-date">${p.date}</span>
<span class="card-read">読む →</span>
</div>
</div>
</a>`).join('');
}
render();
</script>
</body>
</html>
